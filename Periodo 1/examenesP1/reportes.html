<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Resultados | Aula Plus</title>
    <link rel="icon" type="image/x-icon" href="../../assets/Icono.ico">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; }
        .outfit { font-family: 'Outfit', sans-serif; }
        .card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .btn-google {
            background: #4f46e5;
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-google:hover { transform: translateY(-2px); opacity: 0.9; }
        #detail-panel {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        #detail-panel.flex { display: flex; }
        .detail-card {
            background: white;
            width: 100%;
            max-width: 760px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }
        .close-detail {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #f1f5f9;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }
        .close-detail:hover { background: #e2e8f0; color: #1e293b; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div id="login-overlay">
        <div class="login-card">
            <h2 class="outfit text-2xl font-black mb-2">Acceso a Reportes</h2>
            <p class="text-slate-500 mb-8">Debes identificarte para ver los resultados.</p>
            <button onclick="loginWithGoogle()" class="btn-google">
                <img src="https://www.google.com/favicon.ico" style="width: 20px;" alt="Google">
                Entrar con Google
            </button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div class="flex items-center gap-4">
                <a href="../examenesP1.html" class="w-12 h-12 bg-white border border-slate-200 rounded-xl flex items-center justify-center text-xl hover:bg-slate-50 transition-all shadow-sm">
                    ⬅️
                </a>
                <div>
                    <h1 class="outfit text-4xl font-black text-slate-900">Resultados de Examenes</h1>
                    <p class="text-slate-500 font-medium">Vista agrupada por examen, estudiantes e intentos.</p>
                </div>
            </div>
            <button onclick="loadResults()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg shadow-indigo-200">
                Actualizar Lista
            </button>
        </header>

        <div class="card overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-100">
                    <tr>
                        <th class="px-6 py-4 text-xs font-black text-slate-400 uppercase">Examen</th>
                        <th class="px-6 py-4 text-xs font-black text-slate-400 uppercase">Grado</th>
                        <th class="px-6 py-4 text-xs font-black text-slate-400 uppercase text-center">Estudiantes</th>
                        <th class="px-6 py-4 text-xs font-black text-slate-400 uppercase text-center">Intentos</th>
                        <th class="px-6 py-4 text-xs font-black text-slate-400 uppercase text-center">Promedio</th>
                        <th class="px-6 py-4 text-xs font-black text-slate-400 uppercase text-right">Accion</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        <td colspan="6" class="px-6 py-10 text-center text-slate-400 font-medium">
                            <div class="flex flex-col items-center gap-2">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                                Cargando resultados...
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="detail-panel" onclick="if(event.target === this) this.classList.remove('flex')">
        <div class="detail-card p-10">
            <button class="close-detail" onclick="document.getElementById('detail-panel').classList.remove('flex')">&times;</button>
            <div class="flex items-center gap-4 mb-6">
                <div class="w-14 h-14 bg-indigo-50 rounded-2xl flex items-center justify-center text-3xl">👥</div>
                <div>
                    <h3 class="outfit text-3xl font-black text-slate-800" id="det-name">Examen</h3>
                    <p class="text-slate-400 font-bold" id="det-grade">Grado: --</p>
                </div>
            </div>
            <div class="space-y-4" id="det-list"></div>
        </div>
    </div>

    <script>
        let examReports = [];

        async function checkAuth() {
            try {
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError) {
                    console.error("Session error:", sessionError);
                    return;
                }

                if (session) {
                    const { data, error: dbError } = await supabase
                        .from('usuarios_autorizados')
                        .select('email')
                        .eq('email', session.user.email)
                        .maybeSingle();

                    if (data && !dbError) {
                        document.getElementById('login-overlay').style.display = 'none';
                        loadResults();
                    } else {
                        const msg = dbError 
                            ? "Error de base de datos: " + dbError.message 
                            : "No tienes permiso para ver estos reportes. Correo: " + session.user.email;
                        alert(msg);
                        await supabase.auth.signOut();
                        window.location.reload();
                    }
                } else {
                    document.getElementById('login-overlay').style.display = 'flex';
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        }

        async function loginWithGoogle() {
            const redirectURL = window.location.origin + window.location.pathname;
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: redirectURL
                }
            });
            if (error) {
                console.error("Error OAuth:", error);
                alert("Error al conectar con Google: " + error.message);
            }
        }

        function getAttemptNumber(attempt) {
            return attempt.attempt_number || (attempt.respuestas_detalladas && attempt.respuestas_detalladas.attempt_number) || 1;
        }

        function getAttemptStamp(attempt) {
            return new Date(attempt.actualizado_en || attempt.creado_en || 0).getTime();
        }

        async function loadResults() {
            const body = document.getElementById('results-body');

            const { data, error } = await supabase
                .from('intentos_examen')
                .select('*');

            if (error) {
                body.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-red-500 font-bold">Error: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                body.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400 font-medium italic">No se encontraron resultados registrados aun.</td></tr>`;
                return;
            }

            const examMap = new Map();

            data.forEach(attempt => {
                const title = attempt.titulo || (attempt.respuestas_detalladas && attempt.respuestas_detalladas.titulo) || `Examen ${attempt.grado}`;
                const examKey = `${attempt.grado}__${attempt.session_id}__${title}`;

                if (!examMap.has(examKey)) {
                    examMap.set(examKey, {
                        key: examKey,
                        grado: attempt.grado,
                        session_id: attempt.session_id,
                        titulo: title,
                        attempts: [],
                        studentsMap: new Map()
                    });
                }

                const exam = examMap.get(examKey);
                exam.attempts.push(attempt);

                if (!exam.studentsMap.has(attempt.nombre_estudiante)) {
                    exam.studentsMap.set(attempt.nombre_estudiante, {
                        nombre_estudiante: attempt.nombre_estudiante,
                        intentos: [],
                        mejor_nota: 0,
                        total_preguntas: attempt.total_preguntas || 0,
                        ultimo_intento: null
                    });
                }

                const student = exam.studentsMap.get(attempt.nombre_estudiante);
                student.intentos.push(attempt);
                student.mejor_nota = Math.max(student.mejor_nota, Number(attempt.puntaje || 0));
                student.total_preguntas = Math.max(student.total_preguntas || 0, attempt.total_preguntas || 0);

                if (!student.ultimo_intento || getAttemptStamp(attempt) >= getAttemptStamp(student.ultimo_intento)) {
                    student.ultimo_intento = attempt;
                }
            });

            examReports = Array.from(examMap.values()).map(exam => {
                const students = Array.from(exam.studentsMap.values()).map(student => {
                    student.intentos.sort((a, b) => getAttemptNumber(a) - getAttemptNumber(b));
                    return student;
                });

                const average = students.length
                    ? Math.round(students.reduce((sum, student) => {
                        const total = student.total_preguntas || 1;
                        return sum + ((student.mejor_nota / total) * 100);
                    }, 0) / students.length)
                    : 0;

                const latestStamp = exam.attempts.reduce((max, attempt) => Math.max(max, getAttemptStamp(attempt)), 0);

                return {
                    key: exam.key,
                    grado: exam.grado,
                    session_id: exam.session_id,
                    titulo: exam.titulo,
                    totalStudents: students.length,
                    totalAttempts: exam.attempts.length,
                    average,
                    latestStamp,
                    students
                };
            });

            examReports.sort((a, b) => b.latestStamp - a.latestStamp);

            body.innerHTML = '';
            examReports.forEach(exam => {
                const row = document.createElement('tr');
                row.className = 'border-b border-slate-50 hover:bg-slate-50 transition-colors cursor-pointer';
                row.onclick = () => showDetail(exam.key);
                row.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-700">${exam.titulo}</td>
                    <td class="px-6 py-4 font-medium text-slate-500">${exam.grado}</td>
                    <td class="px-6 py-4 text-center"><span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">${exam.totalStudents}</span></td>
                    <td class="px-6 py-4 text-center"><span class="text-lg font-black text-indigo-600">${exam.totalAttempts}</span></td>
                    <td class="px-6 py-4 text-center"><span class="text-lg font-black ${exam.average >= 60 ? 'text-green-600' : 'text-amber-600'}">${exam.average}%</span></td>
                    <td class="px-6 py-4 text-right"><button class="text-indigo-600 font-bold text-sm hover:underline">Ver Detalle</button></td>
                `;
                body.appendChild(row);
            });
        }

        function showDetail(examKey) {
            const exam = examReports.find(item => item.key === examKey);
            if (!exam) return;

            document.getElementById('detail-panel').classList.add('flex');
            document.getElementById('det-name').textContent = exam.titulo;
            document.getElementById('det-grade').textContent = `Grado: ${exam.grado} | Estudiantes: ${exam.totalStudents} | Intentos: ${exam.totalAttempts}`;

            const list = document.getElementById('det-list');
            list.innerHTML = '';

            const latestDate = exam.latestStamp ? new Date(exam.latestStamp).toLocaleString() : '--';
            list.innerHTML += `<p class="text-[10px] text-indigo-400 font-black uppercase mb-4">Ultima actividad: ${latestDate}</p>`;

            exam.students
                .sort((a, b) => a.nombre_estudiante.localeCompare(b.nombre_estudiante))
                .forEach(student => {
                    const total = student.total_preguntas || 1;
                    const bestPercent = Math.round((student.mejor_nota / total) * 100);
                    const lastAttempt = student.ultimo_intento;
                    const lastAttemptNum = lastAttempt ? getAttemptNumber(lastAttempt) : 0;
                    const lastDate = lastAttempt ? new Date(lastAttempt.actualizado_en || lastAttempt.creado_en || 0).toLocaleString() : '--';

                    const card = document.createElement('div');
                    card.className = 'mb-5 p-5 bg-slate-50 rounded-3xl border border-slate-200';
                    card.innerHTML = `
                        <div class="flex justify-between items-start gap-4 mb-3">
                            <div>
                                <h4 class="font-black text-slate-800 text-lg">${student.nombre_estudiante}</h4>
                                <p class="text-xs font-bold text-slate-400 uppercase">Intentos: ${student.intentos.length} | Mejor nota: ${student.mejor_nota}/${total} (${bestPercent}%)</p>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-black text-indigo-500 uppercase">Ultimo intento</div>
                                <div class="font-black text-slate-700">#${lastAttemptNum}</div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${student.intentos.map(attempt => {
                                const attemptNum = getAttemptNumber(attempt);
                                const attemptDate = new Date(attempt.actualizado_en || attempt.creado_en || 0).toLocaleString();
                                const finished = attempt.finalizado || (attempt.respuestas_detalladas && attempt.respuestas_detalladas.finished);
                                return `
                                    <div class="bg-white border border-slate-200 rounded-2xl px-4 py-3">
                                        <div class="flex justify-between items-center gap-3">
                                            <div>
                                                <div class="font-bold text-slate-700">Intento #${attemptNum}</div>
                                                <div class="text-[10px] font-bold text-slate-400 uppercase">${attemptDate}</div>
                                            </div>
                                            <div class="text-right">
                                                <div class="font-black ${attempt.puntaje >= (attempt.total_preguntas / 2) ? 'text-green-600' : 'text-red-600'}">${attempt.puntaje}/${attempt.total_preguntas}</div>
                                                <div class="text-[10px] font-bold ${finished ? 'text-green-500' : 'text-amber-500'} uppercase">${finished ? 'Finalizado' : 'En progreso'}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mt-3">Ultima actividad: ${lastDate}</p>
                    `;
                    list.appendChild(card);
                });
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
